apiVersion: v2
name: demo-app-chart
description: Spring Boot Demo Application Helm Chart for CI/CD Learning

# Application chart for packaging and deploying demo-app
type: application

# Chart version - increment when making changes to the chart structure
version: 1.0.0

# Application version - matches the demo-app version
appVersion: "1.0.0"

# Maintainer information
maintainers:
  - name: Java Cloud Native Learning
    email: admin@example.com

# Keywords for discoverability
keywords:
  - spring-boot
  - java
  - demo
  - cicd
  - learning

# Source repository
home: http://localhost:30002/demo-app/demo-app
