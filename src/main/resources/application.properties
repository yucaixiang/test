# Spring Boot Application Configuration
# Demo App for CI/CD Learning Environment

# Application Name
spring.application.name=demo-app

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Actuator Configuration (Health Checks)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application Info (visible in /actuator/info)
info.app.name=Demo Application
info.app.description=Spring Boot demo app for CI/CD pipeline
info.app.version=1.0.0
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@
